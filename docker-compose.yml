# Laboratorio local CCUC (spec 5.2): un solo comando levanta el entorno completo.
services:
  localstack:
    image: localstack/localstack:4.1.1
    container_name: dev-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3,events
      - DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  gremlin:
    image: tinkerpop/gremlin-server:3.7.4
    container_name: dev-gremlin
    ports:
      - "8182:8182"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'IP=$$(ip -o -4 addr show eth0 | tr -s " " | cut -d" " -f4 | cut -d/ -f1); exec 3<>/dev/tcp/$$IP/8182'
      interval: 10s
      timeout: 5s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: dev-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

  dev-motor-reglas:
    build:
      context: .
      dockerfile: src/motor_reglas/Dockerfile
    container_name: dev-motor-reglas
    command: ["sleep", "infinity"]
    volumes:
      - ./src:/app
      - ./tests:/tests
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - ENDPOINT_URL=http://localstack:4566
      - QUEUE_URL=http://localstack:4566/000000000000/ccuc-novedades-prod.fifo
      - QUEUE_NAME=ccuc-novedades-prod.fifo
      - OPENSEARCH_URL=http://opensearch:9200
      - GREMLIN_HOST=gremlin
      - GREMLIN_PORT=8182
    healthcheck:
      test: ["CMD", "python", "-c", "import motor_reglas.core"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      localstack:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      gremlin:
        condition: service_healthy
